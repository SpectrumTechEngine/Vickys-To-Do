:root{
  --clay:#e7d4c4;
  --clay-deep:#dcc4b0;
  --paper:#f6f0e6;
  --ink:#5c4638;
  --muted:#8a7364;
  --pen:#2a5bd7;
  --terra:#c4845a;
  --blush:#f4c7ae;
  --x:#c5beb6;
  --shadow:0 7px 0 rgba(120,78,52,.12);
  font-family:Nunito,system-ui,sans-serif;
  color:var(--ink);
  background:var(--clay-deep);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--clay-deep);font-weight:600;line-height:1.45;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,textarea,a{font:inherit;color:inherit}
button,a{cursor:pointer}
button{border:0;background:none}
img{max-width:100%}
#app{
  width:min(100%,560px);
  height:100dvh;
  margin:0 auto;
  background:var(--clay);
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
}
#app.is-home{overflow:hidden;display:flex;flex-direction:column;background:#4a3e3b}
.home{flex:1;min-height:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:#4a3e3b}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;pointer-events:none}
.pads{
  flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;
  padding:12px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(#946448,#7e533b);
  box-shadow:inset 0 3px 0 rgba(60,34,20,.25);
}
.pad{
  position:relative;display:block;aspect-ratio:1/1;border-radius:24px;overflow:hidden;
  border:5px solid var(--tile);container-type:inline-size;text-decoration:none;
  box-shadow:0 7px 0 rgba(58,32,18,.45),inset 0 0 0 2px rgba(255,255,255,.25);
  transition:transform .08s ease-out,box-shadow .08s ease-out;
}
.pad-todo{--tile:#5b86c9;--mark:#4caf50}
.pad-dont{--tile:#e7b9a3;--mark:#c8473c}
.pad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pad:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(58,32,18,.45)}
.pad-label{
  position:absolute;right:5cqw;bottom:5cqw;display:inline-flex;align-items:center;gap:2cqw;
  background:var(--paper);color:var(--ink);border-radius:999px;padding:1cqw 5cqw 1.5cqw 4cqw;
  font-family:Caveat,cursive;font-weight:700;font-size:13.5cqw;line-height:1;white-space:nowrap;
  transform:rotate(-4deg);box-shadow:0 1.6cqw 0 rgba(70,42,24,.28);
}
.pad-label svg{width:10cqw;height:10cqw;flex:none}
.pad-label path{fill:none;stroke:var(--mark);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pad:focus-visible{outline:4px solid #fff;outline-offset:2px}
.back:focus-visible,.save:focus-visible,.body:focus-visible{outline:3px solid var(--pen);outline-offset:-4px}
.page{min-height:100%;display:flex;flex-direction:column}
.main{flex:1}
.bar{
  position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:calc(max(12px,env(safe-area-inset-top)) + 6px) 64px 6px;
}
.back{
  position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));
  width:44px;height:44px;border-radius:50%;
  background:var(--paper);display:grid;place-items:center;
  box-shadow:var(--shadow);text-decoration:none;
}
.who{
  width:clamp(112px,34vw,150px);aspect-ratio:1/1;height:auto;border-radius:50%;object-fit:cover;
  border:5px solid var(--paper);box-shadow:0 8px 0 rgba(120,78,52,.16);
}
.bar h1{margin:10px 0 0;font-family:Caveat,cursive;font-weight:700;font-size:2.6rem;line-height:1;overflow-wrap:anywhere}
.bar p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.main{padding:6px 14px 24px;display:flex;flex-direction:column;gap:10px}
.cat,.slip,.editor,.empty,.add-cat{
  background:var(--paper);border-radius:18px;box-shadow:var(--shadow);
}
.cat{padding:6px 8px 4px}
.cat-open{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  text-align:left;text-decoration:none;min-height:52px;padding:8px;border-radius:12px;
}
.cat-name{font-weight:800;font-size:1.12rem}
.cat-count{color:var(--muted);font-size:.92rem;flex:none}
.cat-tools,.confirm{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:0 4px 6px;flex-wrap:wrap}
.quiet{
  min-height:40px;padding:0 10px;border-radius:999px;color:var(--muted);font-weight:800;
}
.quiet.danger{color:#a15a3a}
#rename-input{
  width:100%;border:0;background:transparent;font-weight:800;font-size:1.12rem;padding:8px;min-height:52px;
}
.slip{position:relative}
.slip.is-due{background:var(--blush)}
.body{
  display:block;width:100%;text-align:left;position:relative;
  padding:14px 48px 6px 14px;border-radius:18px 18px 0 0;
}
.title{
  font-family:Caveat,cursive;font-weight:700;font-size:1.85rem;line-height:1.05;
  display:block;overflow-wrap:anywhere;
}
.note{display:block;margin-top:4px;color:var(--muted);font-size:.98rem;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.pen{
  position:absolute;left:-2px;right:28px;top:46%;height:26px;margin-top:-13px;
  transform:rotate(-3deg);pointer-events:none;opacity:0;
}
.is-crossed .pen{opacity:1}
.pen path{
  fill:none;stroke:var(--pen);stroke-width:3.4px;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.is-crossed .pen path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.x{
  position:absolute;top:4px;right:2px;width:44px;height:44px;color:var(--x);
  display:grid;place-items:center;z-index:2;
}
.x:hover,.x:focus-visible{color:#8d8680}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 8px 8px 14px;min-height:40px}
.due,.later,.rem{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:800}
.later,.rem{color:var(--muted)}
.due.is-over{color:#a15a3a}
.rem[hidden]{display:none}
.due img{width:26px;height:26px;border-radius:8px;object-fit:cover;object-position:center 35%}
.edit{margin-left:auto;text-decoration:none;color:var(--muted);font-weight:800;min-height:40px;display:inline-flex;align-items:center;padding:0 8px}
.empty{padding:22px 16px;text-align:center}
.empty img{width:96px;height:96px;border-radius:50%;object-fit:cover}
.empty h2{margin:10px 0 4px;font-size:1.4rem}
.empty p{margin:0;color:var(--muted)}
.add-cat{display:flex;gap:8px;padding:8px;align-items:center}
.add-cat .save{flex:none;padding:0 16px}
.dock .save{width:100%}
.add-cat input{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field span{font-size:.92rem}
input,textarea{
  width:100%;border:0;background:#fffaf4;border-radius:14px;padding:12px 14px;
  min-height:48px;font-size:16px;
}
textarea{min-height:96px;resize:vertical}
.editor{padding:14px;display:flex;flex-direction:column;gap:12px}
.checkline{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
.checkline input{width:22px;height:22px;min-height:0;accent-color:var(--pen)}
.when{display:flex;flex-direction:column;gap:6px}
.when[hidden]{display:none}
.hint{margin:0;color:var(--muted);font-weight:600;font-size:.9rem}
.warn{margin:0;color:#a15a3a;font-weight:800}
.warn[hidden]{display:none}
.dock{position:sticky;bottom:0;padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--clay) 28%)}
.save{
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  background:var(--terra);color:#fffaf6;font-weight:800;min-height:52px;border-radius:999px;padding:0 18px;
}
.save:active{transform:translateY(1px)}
#undo-bar{
  position:fixed;z-index:35;left:50%;bottom:max(16px,env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(380px,calc(100% - 24px));
  background:var(--ink);color:var(--paper);border-radius:16px;
  padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-shadow:0 10px 24px rgba(70,42,24,.2);
}
#undo-bar button{color:var(--paper);font-weight:800;min-height:44px;padding:0 12px}
#undo-bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app[data-view="cat"] #undo-bar,#app[data-view="cat"] ~ #toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
#pop[hidden]{display:none}
#pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:rgba(92,70,56,.14)}
#pop img{width:168px;height:168px;border-radius:50%;object-fit:cover;border:5px solid var(--paper);box-shadow:0 16px 40px rgba(70,42,24,.28)}
#pop.show img{animation:pop-in .42s cubic-bezier(.2,1.25,.36,1)}
@keyframes pop-in{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#toasts{position:fixed;z-index:40;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(400px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:18px;padding:8px 8px 8px 10px;box-shadow:0 12px 30px rgba(70,42,24,.22)}
.toast img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.toast strong{display:block;font-size:.95rem}
.toast p{margin:0;font-family:Caveat,cursive;font-size:1.35rem;line-height:1}
.toast button{margin-left:auto;background:var(--terra);color:#fffaf6;font-weight:800;border-radius:999px;min-height:40px;padding:0 12px;flex:none}
@media(prefers-reduced-motion:reduce){
  .is-crossed .pen path{animation:none;stroke-dashoffset:0}
  #pop.show img{animation:none}
  .pad{transition:none}
}
</style>
</head>

const app = document.getElementById("app");
let data = load();
let ui = { renaming: null, confirm: null };
let undos = [];
let undoTimer = 0;
let futureTimer = 0;
let popTimer = 0;
let saveWarned = 0;

// Native bridge: present when running inside the Capacitor APK, absent in a plain browser.
const CAP = window.Capacitor;
const NATIVE = Boolean(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
function plugin(name) { return NATIVE && CAP.Plugins ? CAP.Plugins[name] || null : null; }

function seed() {
  return {
    categories: {
      todo: [],
      dont: [
        { id: "never", name: "Never" },
        { id: "not-today", name: "Not today" },
        { id: "watch-out", name: "Watch out" }
      ]
    },
    items: []
  };
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) {
  return String(s ?? "").replace(/\u0026/g, "\u0026amp;").replace(/</g, "\u0026lt;").replace(/>/g, "\u0026gt;").replace(/"/g, "\u0026quot;");
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    const cats = parsed.categories || {};
    const cleanCat = (c) => c && typeof c.id === "string" && typeof c.name === "string";
    const cleanItem = (i) => i && typeof i.id === "string" && (i.list === "todo" || i.list === "dont") && typeof i.title === "string";
    return {
      categories: {
        todo: Array.isArray(cats.todo) ? cats.todo.filter(cleanCat) : [],
        dont: Array.isArray(cats.dont) ? cats.dont.filter(cleanCat) : seed().categories.dont
      },
      items: Array.isArray(parsed.items) ? parsed.items.filter(cleanItem).map((i) => ({
        id: i.id, list: i.list, catId: String(i.catId || ""), title: i.title,
        note: String(i.note || ""), due: String(i.due || ""), reminder: String(i.reminder || ""),
        reminderFired: Boolean(i.reminderFired), crossed: Boolean(i.crossed), created: Number(i.created) || 0
      })) : []
    };
  } catch (err) {
    return seed();
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (err) {
    if (Date.now() - saveWarned > 60000) {
      saveWarned = Date.now();
      toast({ list: "dont", title: "Your last change might not stick. The phone may be out of space." }, "Couldn't save");
    }
  }
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isDue(due) { return Boolean(due) && due <= todayStr(); }
function isOverdue(due) { return Boolean(due) && due < todayStr(); }
function dueLabel(due) {
  if (!due) return "";
  if (due === todayStr()) return "Due today";
  const [y, m, d] = due.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const opts = { month: "short", day: "numeric" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";

  return (isOverdue(due) ? "Overdue since " : "Due ") + when;

  if (Number.isNaN(dt.getTime())) return "";
  const opts = { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  if (dt.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return "Reminder " + dt.toLocaleString(undefined, opts);
}
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!parts.length) return { name: "home" };
  if (parts[0] !== "todo" && parts[0] !== "dont") return { name: "home" };
  const list = parts[0];
  if (!parts[1]) return { name: "list", list };
  if (parts[2] === "new") return { name: "edit", list, catId: parts[1], itemId: "" };
  if (parts[2] === "edit" && parts[3]) return { name: "edit", list, catId: parts[1], itemId: parts[3] };
  return { name: "cat", list, catId: parts[1] };
}
function parentHash(view) {
  if (view.name === "home") return null;
  if (view.name === "list") return "#/";
  if (view.name === "cat") return "#/" + view.list;
  return "#/" + view.list + "/" + view.catId;
}
// Back always means "up one level", so the Android back button and the on-screen arrow agree.
function goBack() {

    ui.renaming = null;
    ui.confirm = null;
    render();
    return;
  }
  const up = parentHash(parseHash());
  if (up !== null) { location.replace(up); return; }
  const App = plugin("App");
  if (App) App.exitApp();
}
function itemsIn(list, catId) {
  return data.items.filter((i) => i.list === list && i.catId === catId).slice().sort((a, b) => {
    if (a.crossed !== b.crossed) return a.crossed ? 1 : -1;
    if (a.due !== b.due) {
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due < b.due ? -1 : 1;
    }
    return a.created - b.created;

}
function faceFor(list) { return FACE[list] || FACE.todo; }
function chevron() {
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5 7.5 12 14.5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function xIcon() {
  return '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7 17 17 M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
}
function pen() {
  return '<svg class="pen" viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true"><path d="M4 22 C 28 8, 42 32, 66 20 S 104 6, 132 22 S 176 34, 214 16 S 258 8, 296 20"/></svg>';
}
function checkMark() {
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>';
}
function crossMark() {
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 18 18 M18 6 6 18"/></svg>';
}
function viewHome() {
  return '<div class="home">'
    + '<div class="hero"><img src="' + HEADER + '" alt="Vicky\'s To Do\'s and To Don\'ts"></div>'
    + '<nav class="pads">'
    + '<a class="pad pad-todo" href="#/todo"><img src="' + BTN.todo + '" alt=""><span class="pad-label">To Do\'s' + checkMark() + '</span></a>'
    + '<a class="pad pad-dont" href="#/dont"><img src="' + BTN.dont + '" alt=""><span class="pad-label">To Don\'ts' + crossMark() + '</span></a>'
    + "</nav></div>" + undoBar();
}
function viewList(view) {
  const list = view.list;
  const title = list === "todo" ? "To Do's" : "To Don'ts";
  const sub = list === "todo" ? "Folders you can rename any time." : "Start with these, or make your own.";
  const cats = data.categories[list] || [];
  let body = "";
  if (!cats.length) {
    body = '<section class="empty"><h2>'
      + (list === "todo" ? "A blank pad" : "Nothing to avoid yet")
      + "</h2><p>" + (list === "todo" ? "Name a category, then write the first thing." : "Add a category when you think of one.") + "</p></section>";
  }
  body += cats.map((cat) => {
    const n = data.items.filter((i) => i.list === list && i.catId === cat.id).length;
    const word = n === 1 ? "1 written" : n + " written";
    if (ui.renaming === cat.id) {
      return '<section class="cat"><input id="rename-input" data-list="' + list + '" value="' + esc(cat.name) + '" maxlength="40" aria-label="Category name"></section>';
    }
    let tools = '<div class="cat-tools"><button type="button" class="quiet" data-action="rename" data-id="' + cat.id + '">Rename</button>'
      + '<button type="button" class="quiet danger" data-action="remove-cat" data-id="' + cat.id + '">Remove</button></div>';
    if (ui.confirm === cat.id) {
      tools = '<div class="confirm"><span>Rub out “' + esc(cat.name) + '”?</span>'
        + '<button type="button" class="quiet" data-action="cancel-remove">Keep</button>'
        + '<button type="button" class="quiet danger" data-action="confirm-remove" data-id="' + cat.id + '" data-list="' + list + '">Rub it out</button></div>';
    }
    return '<section class="cat"><a class="cat-open" href="#/' + list + "/" + cat.id + '"><span class="cat-name">' + esc(cat.name) + '</span><span class="cat-count">' + word + "</span></a>" + tools + "</section>";
  }).join("");

    + '<form id="add-cat" class="add-cat" data-list="' + list + '"><input name="name" maxlength="40" placeholder="New category" aria-label="New category" required><button class="save" type="submit">Add</button></form></div>')
    + undoBar();
}
function viewCat(view) {
  const list = view.list;
  const cat = (data.categories[list] || []).find((c) => c.id === view.catId);
  if (!cat) return missing(list);
  const rows = itemsIn(list, cat.id);
  let body = "";
  if (!rows.length) {
    body = '<section class="empty"><p>'
      + (list === "todo" ? "Nothing on this page yet." : "Nothing to avoid here yet.") + "</p></section>";
  }
  body += rows.map(slip).join("");
  return page(list, cat.name, list === "todo" ? "Tap a line to cross it out." : "Tap a line when you mean it.", "#/" + list,
    '<div class="main">' + body + '</div><div class="dock"><a class="save" href="#/' + list + "/" + cat.id + '/new">Write one</a></div>')
    + undoBar();
}
function slip(item) {
  const due = item.due
    ? (isDue(item.due)
      ? '<span class="due' + (isOverdue(item.due) ? " is-over" : "") + '"><img src="' + CLOCK + '" alt="">' + esc(dueLabel(item.due)) + "</span>"
      : '<span class="later">' + esc(dueLabel(item.due)) + "</span>")
    : "";
  const rem = item.reminder && (item.reminderFired || wantsReminder(item)) ? '<span class="rem">' + esc(remLabel(item)) + "</span>" : "";
  const note = item.note ? '<span class="note">' + esc(item.note) + "</span>" : "";
  return '<article class="slip' + (item.crossed ? " is-crossed" : "") + (isDue(item.due) ? " is-due" : "") + '" data-id="' + item.id + '">'
    + '<button type="button" class="x" data-action="delete" data-id="' + item.id + '" aria-label="Remove">' + xIcon() + "</button>"
    + '<button type="button" class="body" data-action="toggle" data-id="' + item.id + '" aria-pressed="' + (item.crossed ? "true" : "false") + '">'
    + '<span class="title">' + esc(item.title) + "</span>" + note + pen() + "</button>"
    + '<div class="meta">' + due + rem
    + '<a class="edit" href="#/' + item.list + "/" + item.catId + "/edit/" + item.id + '">Edit</a></div></article>';
}
function viewEdit(view) {
  const list = view.list;
  const cat = (data.categories[list] || []).find((c) => c.id === view.catId);
  if (!cat) return missing(list);
  let existing = null;
  if (view.itemId) {
    existing = data.items.find((i) => i.id === view.itemId) || null;
    if (!existing) return missing(list);
  }
  const item = existing || { id: "", title: "", note: "", due: "", reminder: "" };
  const heading = existing ? "Change it" : (list === "todo" ? "New to do" : "New to don't");
  const back = "#/" + list + "/" + view.catId;
  const whenHidden = item.reminder ? "" : " hidden";
  return page(list, heading, cat.name, back,
    '<div class="main"><form id="editor" class="editor" data-list="' + list + '" data-cat="' + esc(view.catId) + '" data-id="' + esc(item.id) + '">'
    + '<label class="field"><span>Title</span><input name="title" required maxlength="80" value="' + esc(item.title) + '" placeholder="' + (list === "todo" ? "What needs doing?" : "What are you not doing?") + '"></label>'
    + '<label class="field"><span>Note</span><textarea name="note" maxlength="500" placeholder="Details, if you need them">' + esc(item.note) + "</textarea></label>"
    + '<label class="field"><span>Due date</span><input type="date" name="due" value="' + esc(item.due) + '"></label>'
    + '<label class="checkline"><input type="checkbox" name="remind"' + (item.reminder ? " checked" : "") + ">Set a reminder</label>"
    + '<label class="field when" id="when"' + whenHidden + '><span>When</span><input type="datetime-local" name="reminder" value="' + esc(item.reminder) + '"></label>'
    + '<p class="hint">' + (NATIVE
      ? "Vicky sends a notification at that time, even when the app is closed."
      : "Vicky nudges you at that time while this page is open.") + "</p>"
    + '<p class="warn" id="form-warn" hidden></p>'
    + '<button class="save" type="submit">' + (existing ? "Save" : "Stick it on") + "</button></form></div>");
}
function missing(list) {
  return page(list, "That page is gone", "It may have been rubbed out.", list ? "#/" + list : "#/", '<div class="main"><section class="empty"><p>Head back and pick another.</p></section></div>');
}
function page(list, title, sub, back, inner) {
  return '<div class="page"><header class="bar"><a class="back" href="' + back + '" data-action="back" aria-label="Back">' + chevron() + '</a><img class="who" src="' + faceFor(list) + '" alt=""><div><h1>' + esc(title) + "</h1><p>" + esc(sub) + "</p></div></header>" + inner + "</div>";
}
function undoBar() {
  if (!undos.length) return "";
  return '<div id="undo-bar" role="status"><span>' + esc(undos[undos.length - 1].label) + '</span><button type="button" data-action="undo">Undo</button></div>';
}
function canRender() {
  const tag = document.activeElement && document.activeElement.tagName;
  return tag !== "INPUT" && tag !== "TEXTAREA";
}
function render() {
  const view = parseHash();
  app.classList.toggle("is-home", view.name === "home");
  app.dataset.view = view.name;
  // Light status-bar icons over the dark clay wall, dark icons on the pale pages.
  const bars = plugin("SystemBars");
  if (bars) bars.setStyle({ style: view.name === "home" ? "DARK" : "LIGHT" }).catch(() => {});
  const html = view.name === "home" ? viewHome()
    : view.name === "list" ? viewList(view)
    : view.name === "cat" ? viewCat(view)
    : viewEdit(view);
  app.innerHTML = html;
  const rename = document.getElementById("rename-input");
  if (rename) { rename.focus(); rename.select(); }
}
function react(list) {
  const pop = document.getElementById("pop");
  const img = pop.querySelector("img");
  img.src = faceFor(list);
  img.alt = list === "todo" ? "Vicky smiling" : "Vicky frowning";
  pop.hidden = false;
  pop.classList.remove("show");
  void pop.offsetWidth;
  pop.classList.add("show");
  clearTimeout(popTimer);
  popTimer = setTimeout(() => { pop.hidden = true; pop.classList.remove("show"); }, 1500);
}
function nudgeHeading(item) { return item.list === "todo" ? "Time to do this" : "Stay away from this"; }
function toast(item, heading) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<img src="' + faceFor(item.list) + '" alt="">' + '<div><strong>'
    + esc(heading || nudgeHeading(item))
    + "</strong><p>" + esc(item.title) + '</p></div><button type="button" data-action="dismiss">Got it</button>';
  box.appendChild(el);

function notify(item) {
  if (NATIVE) return; // the APK's scheduled notification already covers this

  try { new Notification("Vicky's Lists", { body: item.title, tag: item.id }); } catch (err) {}
}
// Android notification ids must be 32-bit ints; derive a stable one from the item id.
function notifId(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (Math.imul(h, 31) + id.charCodeAt(i)) | 0;
  return (h & 0x7fffffff) || 1;
}
let syncing = Promise.resolve();
// Mirror every pending reminder into Android's scheduler so they fire with the app closed.
function syncNative() {
  const LN = plugin("LocalNotifications");
  if (!LN) return;
  syncing = syncing.then(async () => {
    const pending = await LN.getPending();
    if (pending.notifications.length) {
      await LN.cancel({ notifications: pending.notifications.map((n) => ({ id: n.id })) });
    }
    const now = Date.now();
    const notifications = data.items.filter(wantsReminder).map((item) => ({
      id: notifId(item.id),
      title: nudgeHeading(item),
      body: item.title,
      schedule: { at: new Date(item.reminder), allowWhileIdle: true },
      extra: { itemId: item.id }
    })).filter((n) => n.schedule.at.getTime() > now);

  }).catch(() => {});
}
function askNotifyPermission() {
  const LN = plugin("LocalNotifications");
  if (LN) {
    LN.requestPermissions().catch(() => {});
  } else if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}
function scanReminders() {
  const now = Date.now();
  let changed = false;
  data.items.forEach((item) => {
    if (!wantsReminder(item)) return;
    const t = new Date(item.reminder).getTime();
    if (Number.isNaN(t) || t > now) return;
    item.reminderFired = true;
    changed = true;
    toast(item);
    notify(item);
  });
  if (changed) {
    save();
    if (canRender()) render();
  }
  scheduleFuture();
}
function scheduleFuture() {
  clearTimeout(futureTimer);
  const now = Date.now();
  let next = null;
  data.items.forEach((item) => {
    if (!wantsReminder(item)) return;
    const t = new Date(item.reminder).getTime();
    if (Number.isNaN(t) || t <= now) return;
    if (next === null || t < next) next = t;
  });

// Each delete pushes an undo entry; Undo restores the most recent one, and the bar
// stays until a few seconds pass with no new deletes.
function pushUndo(entry) {
  undos.push(entry);
  save();
  syncNative();
  render();
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    undos = [];
    const bar = document.getElementById("undo-bar");
    if (bar) bar.remove();
  }, 5000);
}
function deleteItem(id) {
  const idx = data.items.findIndex((i) => i.id === id);
  if (idx < 0) return;
  const [item] = data.items.splice(idx, 1);
  pushUndo({ label: "Rubbed out", restore: () => data.items.splice(Math.min(idx, data.items.length), 0, item) });
}
function deleteCategory(list, id) {
  const cats = data.categories[list] || [];
  const catIdx = cats.findIndex((c) => c.id === id);
  if (catIdx < 0) return;
  const [cat] = cats.splice(catIdx, 1);
  const removed = [];
  data.items = data.items.filter((item, idx) => {
    if (item.list === list && item.catId === id) { removed.push({ item, idx }); return false; }
    return true;
  });
  ui.confirm = null;
  pushUndo({
    label: "Rubbed out “" + cat.name + "”",
    restore: () => {
      cats.splice(Math.min(catIdx, cats.length), 0, cat);
      removed.forEach(({ item, idx }) => data.items.splice(Math.min(idx, data.items.length), 0, item));
    }
  });
}
function undoLast() {
  const entry = undos.pop();
  if (!entry) return;
  entry.restore();
  if (!undos.length) clearTimeout(undoTimer);
  save();
  syncNative();
  render();
}
function commitRename(input, redraw) {
  const id = ui.renaming;
  if (!id || !input) return;
  const list = input.dataset.list;
  const name = input.value.trim().slice(0, 40);
  ui.renaming = null;
  const cat = (data.categories[list] || []).find((c) => c.id === id);
  if (cat && name) cat.name = name;
  save();
  if (redraw) render();
}
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if (action === "back") {
    e.preventDefault();
    goBack();
  } else if (action === "toggle") {
    const item = data.items.find((i) => i.id === id);
    if (!item) return;
    item.crossed = !item.crossed;
    save();
    syncNative();
    const slipEl = el.closest(".slip");
    slipEl.classList.toggle("is-crossed", item.crossed);
    el.setAttribute("aria-pressed", item.crossed ? "true" : "false");
    const rem = slipEl.querySelector(".rem");
    if (rem) rem.hidden = !(item.reminderFired || wantsReminder(item));
    if (item.crossed) react(item.list);
  } else if (action === "delete") {
    deleteItem(id);
  } else if (action === "undo") {
    undoLast();
  } else if (action === "rename") {
    ui.confirm = null;
    ui.renaming = id;
    render();
  } else if (action === "remove-cat") {
    ui.renaming = null;
    ui.confirm = id;
    render();
  } else if (action === "cancel-remove") {
    ui.confirm = null;
    render();
  } else if (action === "confirm-remove") {
    deleteCategory(el.dataset.list, id);
  }
});
app.addEventListener("keydown", (e) => {
  if (e.target.id === "rename-input" && e.key === "Enter") {
    e.preventDefault();
    commitRename(e.target, true);
  } else if (e.target.id === "rename-input" && e.key === "Escape") {
    ui.renaming = null;
    render();
  } else if (e.target.classList && e.target.classList.contains("body") && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    e.target.click();
  }
});
app.addEventListener("focusout", (e) => {
  if (e.target.id !== "rename-input") return;
  // If focus moved to another control in the app, let that control's own action re-render.
  const next = e.relatedTarget;
  commitRename(e.target, !(next && app.contains(next)));
});
app.addEventListener("change", (e) => {
  if (e.target.name !== "remind") return;
  const when = document.getElementById("when");
  if (!when) return;
  when.hidden = !e.target.checked;
  const field = when.querySelector("input");
  if (e.target.checked && field && !field.value) {
    const due = document.querySelector("#editor [name=due]");
    const day = (due && due.value) || todayStr();
    field.value = day + "T09:00";
  }
  if (e.target.checked) askNotifyPermission();
});
app.addEventListener("submit", (e) => {
  const form = e.target;
  if (form.id === "add-cat") {
    e.preventDefault();
    const list = form.dataset.list;
    const name = String(new FormData(form).get("name") || "").trim().slice(0, 40);
    if (!name) return;
    data.categories[list].push({ id: uid(), name });
    save();
    ui.renaming = null;
    ui.confirm = null;
    render();
  } else if (form.id === "editor") {
    e.preventDefault();
    const list = form.dataset.list;
    const catId = form.dataset.cat;
    const id = form.dataset.id;
    const f = form.elements;
    const title = f.title.value.trim();
    if (!title) { f.title.value = ""; f.title.reportValidity(); return; }
    const existing = id ? data.items.find((i) => i.id === id) : null;
    if (id && !existing) return;
    const remindOn = f.remind.checked;
    const reminder = remindOn ? f.reminder.value : "";
    const warn = document.getElementById("form-warn");
    const fail = (msg) => { warn.textContent = msg; warn.hidden = false; f.reminder.focus(); };
    if (remindOn && !reminder) { fail("Pick a time for the reminder."); return; }
    const changedReminder = !existing || existing.reminder !== reminder;
    if (reminder && changedReminder && new Date(reminder).getTime() <= Date.now()) {
      fail("That time has already passed. Pick a later one.");
      return;
    }
    warn.hidden = true;
    if (existing) {
      if (changedReminder) existing.reminderFired = false;
      existing.title = title.slice(0, 80);
      existing.note = f.note.value.trim().slice(0, 500);
      existing.due = f.due.value;
      existing.reminder = reminder;
    } else {
      data.items.push({
        id: uid(), list, catId, title: title.slice(0, 80),
        note: f.note.value.trim().slice(0, 500), due: f.due.value, reminder,
        reminderFired: false, crossed: false, created: Date.now()
      });
    }
    save();
    syncNative();
    // Replace rather than push, so Back from the list doesn't land on the form again.
    location.replace("#/" + list + "/" + catId);
    scanReminders();
  }
});
document.getElementById("toasts").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action='dismiss']");
  if (btn) btn.closest(".toast").remove();
});
window.addEventListener("hashchange", () => {
  ui.renaming = null;
  ui.confirm = null;
  var popEl = document.getElementById("pop");
  popEl.hidden = true;
  popEl.classList.remove("show");
  render();
});
window.addEventListener("storage", (e) => {
  if (e.key !== KEY) return;
  data = load();
  render();
  scanReminders();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") scanReminders();
});
if (NATIVE) {
  const App = plugin("App");
  if (App) App.addListener("backButton", goBack);
  const LN = plugin("LocalNotifications");
  if (LN) {
    // Tapping a reminder notification opens the page that item lives on.
    LN.addListener("localNotificationActionPerformed", (ev) => {
      const itemId = ev && ev.notification && ev.notification.extra && ev.notification.extra.itemId;
      const item = data.items.find((i) => i.id === itemId);
      if (item) location.replace("#/" + item.list + "/" + item.catId);
    });
  }
}
render();
scanReminders();
syncNative();
</script>
